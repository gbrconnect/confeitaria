<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#94733A">
<meta property="og:title" content="Gestão Confeitarias">
<meta property="og:description" content="GBR Connect">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gbrconnect.github.io/confeitaria/capa.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GBR Connect">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gestão Confeitarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral fixa no notebook, barra inferior no celular; área principal em blocos de trabalho. */
:root{
  --bg:#F6F5F9; --surface:#FFFFFF; --surface-2:#F0EEF5; --ink:#2A2229; --muted:#766C77; --line:#E5E1EA;
  --gold:#94733A; --gold-strong:#7A5D2B; --gold-soft:#F4ECDD; --lilac:#8E86C2; --lilac-soft:#ECEAF7;
  --ok:#2E7A57; --ok-soft:#E3F2EA; --warn:#A8701A; --warn-soft:#FBF0DC; --bad:#B03F3A; --bad-soft:#F8E3E1;
  --shadow:0 1px 2px rgba(42,34,41,.05),0 4px 16px rgba(42,34,41,.05);
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121A; --surface:#1F1B25; --surface-2:#282330; --ink:#EEE9F1; --muted:#A69DAD; --line:#35303D;
  --gold:#D2B274; --gold-strong:#E2C58B; --gold-soft:#2F2819; --lilac:#ADA6DE; --lilac-soft:#29253A;
  --ok:#6BC49A; --ok-soft:#1B3128; --warn:#E3AE5B; --warn-soft:#352A17; --bad:#EE8A83; --bad-soft:#3A1F1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121A; --surface:#1F1B25; --surface-2:#282330; --ink:#EEE9F1; --muted:#A69DAD; --line:#35303D;
  --gold:#D2B274; --gold-strong:#E2C58B; --gold-soft:#2F2819; --lilac:#ADA6DE; --lilac-soft:#29253A;
  --ok:#6BC49A; --ok-soft:#1B3128; --warn:#E3AE5B; --warn-soft:#352A17; --bad:#EE8A83; --bad-soft:#3A1F1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--gold-strong)}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 24px;display:flex;flex-direction:column;gap:18px}
.brand{padding:4px 10px 10px;text-align:center;border-bottom:1px solid var(--line)}
.brand .wm{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.03em}
.brand .wm i{font-style:normal}
.brand .sub{display:flex;align-items:center;gap:8px;justify-content:center;font-size:9.5px;letter-spacing:.32em;color:var(--gold);margin-top:6px}
.brand .sub::before,.brand .sub::after{content:"";height:1px;width:26px;background:var(--gold);opacity:.6}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h6{margin:0 0 4px;padding:0 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink);font-weight:500}
.navbtn svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
.navbtn:hover{background:var(--surface-2)}
.navbtn.on{background:var(--gold-soft);color:var(--gold-strong)}
.navbtn.on svg{stroke:var(--gold-strong)}
.navbtn .badge{margin-left:auto}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}

main{min-width:0;padding-block:26px 40px;padding-inline:34px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.pagehead h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.025em}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;background:var(--lilac-soft);color:var(--lilac);padding:3px 10px;border-radius:99px;vertical-align:middle}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1a1510}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#1a1510}}
.btn.pri:hover{background:var(--gold-strong);border-color:var(--gold-strong)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:16px;height:16px;stroke:currentColor}
.x svg{stroke:currentColor}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .btn{text-transform:none;letter-spacing:0}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12.5px;margin-top:4px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-aguardando_sinal{background:var(--warn-soft);color:var(--warn)}
.st-confirmado{background:var(--lilac-soft);color:var(--lilac)}
.st-producao{background:var(--gold-soft);color:var(--gold-strong)}
.st-pronto{background:var(--ok-soft);color:var(--ok)}
.st-entregue{background:var(--surface-2);color:var(--muted)}
.st-cancelado{background:var(--bad-soft);color:var(--bad)}
.st-aberto{background:var(--surface-2);color:var(--muted)}
.st-enviado{background:var(--lilac-soft);color:var(--lilac)}
.st-aprovado{background:var(--ok-soft);color:var(--ok)}
.st-recusado{background:var(--bad-soft);color:var(--bad)}
.mg{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.mg.ok{background:var(--ok-soft);color:var(--ok)} .mg.warn{background:var(--warn-soft);color:var(--warn)} .mg.bad{background:var(--bad-soft);color:var(--bad)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;max-width:340px}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lilac);box-shadow:0 0 0 3px var(--lilac-soft)}
textarea{resize:vertical;min-height:70px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f small,div.f small{font-weight:400}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.strong{font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--gold)}
.item .date{width:52px;text-align:center;border-right:1px solid var(--line);padding-right:14px}
.item .date b{display:block;font-size:22px;line-height:1;font-weight:600}
.item .date span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.alert:last-child{border-bottom:0}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--lilac)} .dot.ok{background:var(--ok)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.bar i.over{background:var(--bad)} .bar i.full{background:var(--warn)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.day.today{border-color:var(--gold)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.day-h b{font-size:15px}
.prodlist{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:13px}
.prodlist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}

.dre{width:100%;font-size:14px}
.dre td{padding:7px 0;border-bottom:1px solid var(--line)}
.dre tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.dre tr.sub td{color:var(--muted)}
.dre td:last-child{text-align:right;font-variant-numeric:tabular-nums}

.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--lilac);border-radius:4px}

.overlay{position:fixed;inset:0;background:rgba(20,15,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wide{max-width:980px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-b>*{flex-shrink:0}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.modal-f .sp{margin-right:auto}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 -6px}
.irow{display:grid;grid-template-columns:minmax(0,2.4fr) 90px 110px 110px 36px;gap:8px;align-items:center}
.irow.h{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.irow .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ecrow{grid-template-columns:minmax(0,2.4fr) 100px 130px 110px 36px}
.crow{display:grid;grid-template-columns:110px minmax(0,2fr) 110px 110px 36px;gap:8px;align-items:center}
.inner{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px}
.inner .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-strong);margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-size:17px;font-variant-numeric:tabular-nums}
.x{border:0;background:none;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--bad)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.detail-grid div span{display:block;font-size:12px;color:var(--muted)}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-family:var(--f-body);font-size:13.5px;margin:0;max-height:300px;overflow:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1280px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}.tile{grid-column:span 2}.tile:nth-child(n+4){grid-column:span 3}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.tile.atn{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tile-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tile-ico{width:36px;height:36px;border-radius:10px;background:var(--gold-soft);display:inline-flex;align-items:center;justify-content:center;flex:none}
.tile-ico svg{width:20px;height:20px;stroke:var(--gold-strong)}
.tile-t{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-h .badge{margin-left:auto}
.tile-n{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
.tile-l{font-size:13px;color:var(--muted);font-weight:500}
.tile-s{font-size:12.5px;color:var(--muted);min-height:36px;margin-top:8px;line-height:1.45}
.tile-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);min-height:44px}
.tile-go{font-size:13px;font-weight:600;color:var(--gold-strong);margin-left:auto}
.etapas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.etapa{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.etapa:hover{border-color:var(--gold)}
.etapa b{font-size:20px}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--gold-soft);color:var(--gold-strong);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:1px solid var(--line)}
.av.sm{width:24px;height:24px;font-size:11px}
.av.lg{width:76px;height:76px;font-size:28px}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.foto-ed{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-img{display:block;margin:0 auto;max-width:100%;max-height:72px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.topbar .logo-img{max-height:36px;margin:0;padding:3px 6px}
.av.md{width:52px;height:52px;font-size:20px}
.car-banner{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 20px;margin-bottom:16px}
.car-banner .t{font-weight:800;font-size:17px;letter-spacing:-.01em}
.car-banner .s{font-size:13px;opacity:.8}
.car-banner .btn{background:var(--gold);border-color:var(--gold);color:#fff}
.car-sum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.car-sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.car-sum span{display:block;font-size:12px;color:var(--muted)}
.car-sum b{font-size:17px}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pos-p{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 12px;cursor:pointer;min-width:0}
.pos-p:hover{border-color:var(--gold)}
.pos-p:active{transform:scale(.97)}
.pos-p.fim{opacity:.45;cursor:not-allowed}
.pos-n{font-weight:600;font-size:13px;line-height:1.3;min-height:34px;display:flex;align-items:center}
.pos-v{font-weight:800;font-size:16px}
.pos-r{font-size:12px;color:var(--muted)}
.pos-q{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:99px;background:var(--gold);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tk{position:sticky;top:16px}
.pos-w{position:relative;min-width:0;display:flex}
.pos-w .pos-p{flex:1}

function lerImagem(inp,opt,cb){
 const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!/^image\//.test(f.type))return toast('Escolha um arquivo de imagem (PNG ou JPG).','bad');
 const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  let sx=0,sy=0,sw=img.width,sh=img.height,w,h;

/* ============ cálculos de custo ============ */
const CFG=()=>S.config;
const getIns=id=>S.insumos.find(x=>x.id===id);
const getRec=id=>S.receitas.find(x=>x.id===id);
const getProd=id=>S.produtos.find(x=>x.id===id);
const getCli=id=>S.clientes.find(x=>x.id===id);
function custoUnitIns(i,ov){const f=ov&&ov[i.id]?ov[i.id]:1;return i.qtdEmb>0?i.precoEmb/i.qtdEmb*f:0}
function custoReceita(r,ov){let t=0;for(const g of r.itens){const i=getIns(g.id);if(i)t+=g.qtd*custoUnitIns(i,ov)}const util=r.rendimento*(1-(r.perda||0)/100);return{total:t,porG:util>0?t/util:0,util}}
const ehRep=id=>!!((getProd(id)||{}).repasse);
const repItens=its=>(its||[]).reduce((s,x)=>s+(ehRep(x.p)?x.q*x.v:0),0);
function custoProduto(p,ov,depth=0){
 let mat=0,mo=0;if(!p||depth>6||p.repasse)return{mat:0,mo:0,ind:0,total:0};
 if(p.modoCusto==='manual'){const c=+p.custoManual||0;return{mat:c,mo:0,ind:0,total:c}}
 for(const it of p.itens||[]){
  if(it.t==='i'){const i=getIns(it.id);if(i)mat+=it.q*custoUnitIns(i,ov)}
  else if(it.t==='r'){const r=getRec(it.id);if(r)mat+=it.q*custoReceita(r,ov).porG}
  else if(it.t==='p'){const s=getProd(it.id);if(s&&s.id!==p.id){const c=custoProduto(s,ov,depth+1);mat+=it.q*c.mat;mo+=it.q*c.mo}}
 }
 mo+=(p.tempo||0)*CFG().custoHora/60;
 const ind=mat*CFG().indireto/100;
 return{mat,mo,ind,total:mat+mo+ind};
}
const txD=()=>+(CFG().taxaDebito??CFG().taxa??0)||0,txC=()=>+(CFG().taxaCredito??CFG().taxa??0)||0;
function taxaForma(f){f=String(f||'');return /d[ée]b/i.test(f)?txD():/cr[ée]d|cart/i.test(f)?txC():0}
const formaCar=f=>f==='Cartão'?'Crédito':f;
function taxasVendas(vs){return vs.reduce((s,v)=>s+(v.total??v.valor??0)*taxaForma(v.forma)/100,0)}
/* Na precificação vale a taxa do crédito (pior caso): o preço se sustenta em qualquer forma de pagamento */
const deducoes=()=>(CFG().imposto+txC())/100;
function precoSugerido(total,alvo){const a=(alvo??CFG().margemAlvo)/100;const den=1-deducoes()-a;return den>0?total/den:0}
function margem(preco,total){return preco>0?(preco*(1-deducoes())-total)/preco:0}
function mgClass(m){return m<CFG().margemMin/100?'bad':m<CFG().margemAlvo/100?'warn':'ok'}
const mgChip=m=>`<span class="mg ${mgClass(m)}">${pct(m)}</span>`;
function necessidade(prodId,qtd,acc,depth=0){
 const p=getProd(prodId);if(!p||depth>6||p.modoCusto==='manual')return acc;
 for(const it of p.itens){
  if(it.t==='i')acc[it.id]=(acc[it.id]||0)+it.q*qtd;
  else if(it.t==='r'){const r=getRec(it.id);if(!r)continue;const util=r.rendimento*(1-(r.perda||0)/100);const f=util>0?it.q*qtd/util:0;for(const g of r.itens)acc[g.id]=(acc[g.id]||0)+g.qtd*f}
  else if(it.t==='p'&&it.id!==prodId)necessidade(it.id,it.q*qtd,acc,depth+1);
 }
 return acc;
}
function unidadesCap(prodId,qtd,depth=0){const p=getProd(prodId);if(!p||depth>6)return 0;if(p.contaCap)return qtd;let u=0;for(const it of p.itens)if(it.t==='p'&&it.id!==prodId)u+=unidadesCap(it.id,it.q*qtd,depth+1);return u}
function totaisDoc(o){
 const sub=o.itens.reduce((s,x)=>s+x.q*x.v,0);const total=Math.max(0,sub-(o.desconto||0)+(o.frete||0));
 let custo=0,mat=0,mo=0,un=0;for(const x of o.itens){const c=custoProduto(getProd(x.p));custo+=x.q*c.total;mat+=x.q*(c.mat+c.ind);mo+=x.q*c.mo;un+=o.frente==='estacao'?0:unidadesCap(x.p,x.q)}
 const pago=(o.pagamentos||[]).reduce((s,x)=>s+x.valor,0);
 const rp=Math.min(total,repItens(o.itens)),rec=total-rp;const liq=rec*(1-deducoes());
 return{rep:rp,rec,sub,total,custo,mat,mo,un,pago,saldo:+(total-pago).toFixed(2),lucro:liq-custo,margem:rec>0?(liq-custo)/rec:0};
}

function graficoMeses(ms){
 const W=560,H=190,pl=46,pb=26,pt=14,max=Math.max(...ms.map(m=>m.v),1);
 const step=niceStep(max);const top=Math.ceil(max/step)*step;const bw=(W-pl-10)/ms.length;
 let g='';for(let v=0;v<=top+0.001;v+=step){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v>=1000?nq(v/1000)+' mil':nq(v)}</text>`}
 ms.forEach((m,i)=>{const hgt=(H-pt-pb)*(m.v/top);const x=pl+i*bw+bw*0.22;const last=i===ms.length-1;
  g+=`<rect x="${x}" y="${H-pb-hgt}" width="${bw*0.56}" height="${Math.max(hgt,0)}" rx="4" fill="${last?'var(--gold)':'var(--lilac)'}" opacity="${last?1:.55}"><title>${mesLabel(m.k)}: ${brl(m.v)}</title></rect>
  <text x="${x+bw*0.28}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESC[+m.k.slice(5)-1]}</text>`;
  if(m.v>0)g+=`<text x="${x+bw*0.28}" y="${H-pb-hgt-5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${nq(Math.round(m.v))}</text>`});
 return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;display:block" role="img" aria-label="Faturamento mensal">${g}</svg></div>`;
}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of[1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p}

function tkAdd(p,d=1){const c=carAberto();if(!c)return;const row=carResumo(c).rows.find(x=>x.p===p);if(!row)return;const q=(TK.itens[p]||0)+d;if(d>0&&q>row.resta)return toast('Não há mais unidades desse produto no carrinho.','bad');if(q<=0)delete TK.itens[p];else TK.itens[p]=q;render()}

function registrarVenda(){
 const c=carAberto();if(!c)return;const r=carResumo(c);const itens=Object.entries(TK.itens).filter(([,q])=>q>0).map(([p,q])=>({p,q,v:r.rows.find(x=>x.p===p).preco}));if(!itens.length)return;
 const sub=+itens.reduce((s,x)=>s+x.q*x.v,0).toFixed(2),desc=tkDesc(sub),total=+(sub-desc).toFixed(2);
 /* o desconto é rateado no valor unitário dos itens, para o faturamento por produto fechar com o total */

}

function carrinhoMes(k){
 let rec=0,mat=0,mo=0;
 for(const c of S.carrinhos||[]){for(const v of c.vendas)if(v.data.slice(0,7)===k)for(const x of v.itens){const kk=custoProduto(getProd(x.p));if(!ehRep(x.p))rec+=x.q*x.v;mat+=x.q*(kk.mat+kk.ind);mo+=x.q*kk.mo}
  if(c.status==='fechado'&&(c.fechamento||'').slice(0,7)===k)for(const[p,q]of Object.entries(c.perdas||{})){const kk=custoProduto(getProd(p));mat+=q*(kk.mat+kk.ind);mo+=q*kk.mo}}
 return{rec,mat,mo};
}

 const asc=(a,c)=>(a.dataEntrega+a.hora).localeCompare(c.dataEntrega+c.hora);let corpo='';

  corpo=grupos.map(([nome,fn])=>{const g=L.filter(fn);return g.length?`<div class="grp ${nome==='Atrasados'?'down':''}">${nome} <span>${g.length}</span></div><div class="list">${g.map(cardPedido).join('')}</div>`:''}).join('')||`<div class="empty">${est?'Nenhuma estação agendada. Toque em "Novo pedido" para registrar um evento.':'Nenhuma encomenda para fazer. Que tal criar uma nova?'}</div>`;
 }else if(f==='prontos'){const L=prontos.filter(bate).sort(asc);corpo=L.length?`<div class="list">${L.map(cardPedido).join('')}</div>`:'<div class="empty">Nenhuma encomenda pronta esperando a cliente.</div>'}
 else{const L=fim.filter(bate).sort((a,c)=>c.dataEntrega.localeCompare(a.dataEntrega)).slice(0,40);corpo=L.length?`<div class="list">${L.map(cardPedido).join('')}</div>`:`<div class="empty">${est?'Nenhum evento realizado ainda.':'Nenhuma encomenda finalizada ainda.'}</div>`}
 const tabs=est?[['fazer','Próximas',fazer.length],['fim','Realizadas',0]]:[['fazer','A fazer',fazer.length],['prontos','Prontos',prontos.length],['fim','Finalizados',0]];
 return head(est?'Estação Gourmet':'Encomendas',est?'A estação contratada por algumas horas para servir na festa da cliente. Registre o pacote, a data e o local.':'Toque no botão da encomenda para avançar a etapa, ou na encomenda para ver os detalhes.',`${est?`<button class="btn" onclick="cardapioEstacao()">${ico('pdf')}Cardápio</button>`:''}<button class="btn" onclick="editarDoc('orc',null,'${fr}')">${ico('orcamentos')}Orçamento</button><button class="btn pri" onclick="editarDoc('ped',null,'${fr}')">${ico('plus')}${est?'Novo pedido':'Nova encomenda'}</button>`)
 +`<div class="tabs">${tabs.map(([k,l,n])=>`<button class="${f===k?'on':''}" onclick="UI.pedFiltro='${k}';render()">${l}${n?` <span class="tabn">${n}</span>`:''}</button>`).join('')}</div>

function mudarStatus(id,st,forcar){
 const p=S.pedidos.find(x=>x.id===id);const t=totaisDoc(p);
 if(st==='entregue'&&t.saldo>0.009&&!forcar){return askConfirm(`Ainda falta receber ${brl(t.saldo)} deste pedido.`,'Receber saldo e entregar',()=>{p.pagamentos.push({data:hoje(),valor:t.saldo,forma:'Pix',tipo:'Saldo'});mudarStatus(id,st,true)},'Entregar sem receber',()=>mudarStatus(id,st,true))}
 if(st==='confirmado'&&t.pago<0.01&&!forcar){return askConfirm(`Nenhum sinal registrado. Registrar o sinal de ${CFG().sinalPct}% (${brl(t.total*CFG().sinalPct/100)}) agora?`,'Registrar sinal e confirmar',()=>{p.pagamentos.push({data:hoje(),valor:+(t.total*CFG().sinalPct/100).toFixed(2),forma:'Pix',tipo:'Sinal'});mudarStatus(id,st,true)},'Confirmar sem sinal',()=>mudarStatus(id,st,true))}
 if(['producao','pronto','entregue'].includes(st)&&!p.baixado){baixaEstoque(p,-1);p.baixado=true}
 p.status=st;save();toast(`Pedido #${p.num}: ${(frenteDe(p)==='estacao'?STE:STP)[st].toLowerCase()}`);closeModal();render();const q=_q;_q=false;if(st!=='entregue'&&!q)verPedido(id);
}
function baixaEstoque(p,sinal){const acc={};for(const x of p.itens)necessidade(x.p,x.q,acc);for(const[id,q]of Object.entries(acc)){const i=getIns(id);if(i)i.estoque=+(i.estoque+sinal*q).toFixed(3)}}
function cancelarPedido(id){askConfirm('Cancelar este pedido? Se os insumos já tinham sido baixados, eles voltam para o estoque.','Cancelar pedido',()=>{const p=S.pedidos.find(x=>x.id===id);if(p.baixado){baixaEstoque(p,1);p.baixado=false}p.status='cancelado';save();closeModal();render();toast('Pedido cancelado')},'Voltar')}
function excluirPedido(id){askConfirm('Excluir definitivamente este pedido?','Excluir',()=>{S.pedidos=S.pedidos.filter(x=>x.id!==id);save();closeModal();render();toast('Pedido excluído')},'Voltar')}
function novoPagamento(id){
 const p=S.pedidos.find(x=>x.id===id);const t=totaisDoc(p);
 openModal('Registrar pagamento',`<div class="frow">
  <label class="f">Valor<input type="text" inputmode="decimal" id="pg-valor" value="${n2(Math.max(0,t.saldo))}"></label>
  <label class="f">Data<input type="date" id="pg-data" value="${hoje()}"></label>
  <label class="f">Forma<select id="pg-forma">${['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Transferência'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="f">Tipo<select id="pg-tipo">${['Sinal','Saldo','Parcial'].map(x=>`<option ${x===(t.pago>0?'Saldo':'Sinal')?'selected':''}>${x}</option>`).join('')}</select></label></div>
  <div class="small muted">Total do pedido ${brl(t.total)} · já pago ${brl(t.pago)}</div>`,
 `<button class="btn" onclick="verPedido('${id}')">Voltar</button><button class="btn pri" onclick="salvarPagamento('${id}')">Registrar</button>`);

function salvarPagamento(id){const p=S.pedidos.find(x=>x.id===id);const v=num($('#pg-valor').value);if(v<=0)return toast('Informe um valor maior que zero.','bad');
 p.pagamentos.push({data:$('#pg-data').value||hoje(),valor:+v.toFixed(2),forma:$('#pg-forma').value,tipo:$('#pg-tipo').value});
 if(p.status==='aguardando_sinal')p.status='confirmado';save();toast('Pagamento registrado');render();verPedido(id)}

function editarDoc(kind,id,fr){

function calcCompras(){
 const T=hoje(),ate=addDias(T,UI.compDias);const sts=['confirmado','producao',...(UI.compInclAg?['aguardando_sinal']:[])];
 const ps=S.pedidos.filter(p=>sts.includes(p.status)&&!p.baixado&&p.dataEntrega>=T&&p.dataEntrega<=ate);
 const acc={};for(const p of ps)for(const x of p.itens)necessidade(x.p,x.q,acc);
 const rows=S.insumos.map(i=>{const nec=acc[i.id]||0;const falta=Math.max(0,nec+i.minimo-i.estoque);const emb=falta>0?Math.ceil(falta/i.qtdEmb):0;return{i,nec,falta:Math.max(0,nec-i.estoque),repor:falta,emb,custo:emb*i.precoEmb}}).filter(r=>r.nec>0||r.emb>0);
 rows.sort((a,b)=>b.custo-a.custo);return{ps,rows};
}

 </tbody></table></div>`:'<div class="empty">Nenhum pedido no período precisa de compra.</div>'}`;

function ecIns(i,v){EC.itens[i].id=v;EC.itens[i].preco=getIns(v).precoEmb;ecItens()}
function ecCalc(){
 const bruto=EC.itens.reduce((s,x)=>s+x.emb*x.preco,0);const total=Math.max(0,bruto+EC.frete-EC.desconto);const fator=bruto>0?total/bruto:1;
 const ag={};for(const x of EC.itens){const i=getIns(x.id);if(!i||!(x.emb>0))continue;const a=ag[x.id]=ag[x.id]||{i,emb:0,valor:0};a.emb+=x.emb;a.valor+=x.emb*x.preco*fator}
 const met=CFG().custoMetodo||'medio';
 const ef=Object.values(ag).map(a=>{const q=a.emb*a.i.qtdEmb;const cu=a.valor/q;const atual=custoUnitIns(a.i);const est=Math.max(0,a.i.estoque);
  const novo=met==='ultimo'||est<=0?cu:(est*atual+q*cu)/(est+q);return{...a,q,pagoEmb:a.valor/a.emb,novoEmb:+(novo*a.i.qtdEmb).toFixed(2),estNovo:+(a.i.estoque+q).toFixed(3)}});
 return{bruto,total,ef};
}
function ecUpd(){
 EC.itens.forEach((x,i)=>{const e=$('#ec-t-'+i);if(e)e.textContent=brl(x.emb*x.preco)});
 const{bruto,total,ef}=ecCalc();
 $('#ec-res').innerHTML=`<div class="inner"><div class="lbl">Resumo da compra</div><div class="kv"><div><span>Soma dos itens</span><b>${brl(bruto)}</b></div><div><span>Frete e desconto</span><b>${brl(EC.frete-EC.desconto)}</b></div><div><span>Total da nota</span><b>${brl(total)}</b></div></div></div>
 ${ef.length?`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Insumo</th><th class="r">Estoque</th><th class="r">Preço da embalagem</th><th class="r">Variação</th></tr></thead><tbody>${ef.map(e=>{const v=e.i.precoEmb>0?(e.novoEmb-e.i.precoEmb)/e.i.precoEmb:0;return`<tr><td><div class="nm">${avatar(e.i,'sm')}<span>${esc(e.i.nome)}</span></div></td><td class="r">${nq(e.i.estoque)} → <b>${nq(e.estNovo)}</b> ${e.i.un}</td><td class="r">${brl(e.i.precoEmb)} → <b>${brl(e.novoEmb)}</b></td><td class="r ${v>0.001?'down':v<-0.001?'up':'muted'}">${v>0?'+':''}${pct(v)}</td></tr>`}).join('')}</tbody></table></div>`:''}`;
}
function ecSalvar(){
 if(!EC.itens.length)return toast('Adicione pelo menos um item.','bad');
 if(EC.itens.some(x=>!(x.emb>0)))return toast('Informe a quantidade de embalagens de todos os itens.','bad');

 S.compras.push({id:cid,data,fornecedor:forn,forma,frete:EC.frete,desconto:EC.desconto,total:+total.toFixed(2),lanc,itens:ef.map(e=>({id:e.i.id,emb:e.emb,q:e.q,valor:+e.valor.toFixed(2),precoAnt:e.precoAnt,precoNovo:e.novoEmb}))});

function fotoArredondada(src,size=360){return new Promise(res=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);const r=size*0.16;x.beginPath();x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();x.clip();const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);res(cv.toDataURL('image/jpeg',0.88))};im.onerror=()=>res(null);im.src=src})}

 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});const W=210,M=16,R=W-M,FOOT=274,GAP=8,CW=(R-M-GAP)/2,CH=31,FT=26;
 const tc=a=>doc.setTextColor(a[0],a[1],a[2]),fc=a=>doc.setFillColor(a[0],a[1],a[2]),dc=a=>doc.setDrawColor(a[0],a[1],a[2]);

  if(!ok){font('bold',26,PC.gold);const mk=c.marca||'Sweet Ka';doc.text(mk,M,26);const sub=c.marcaSub??'CONFEITARIA';if(sub)caps(sub,M,32.5,7,PC.gold)}
  caps('Catálogo',R,19,9,PC.muted,'right');font('bold',17,PC.ink);doc.text(`${MESES[hd.getMonth()][0].toUpperCase()+MESES[hd.getMonth()].slice(1)} de ${hd.getFullYear()}`,R,27,{align:'right'});

 cab(true);
 for(const[cat,ps]of g){

 const body=`<div class="foto-ed"><span id="pr-foto">${avatar(EP,'lg')}</span><div><div class="actions"><label class="btn sm" style="cursor:pointer">${EP.foto?'Trocar foto':'Enviar foto'}<input type="file" id="pr-foto-in" accept="image/png,image/jpeg,image/webp" hidden onchange="lerImagem(this,{max:400,quadrado:true},f=>{EP.foto=f;$('#pr-foto').innerHTML=avatar(EP,'lg')})"></label><button class="btn sm ghost danger" onclick="EP.foto='';$('#pr-foto').innerHTML=avatar(EP,'lg')">Remover</button></div><div class="small muted" style="margin-top:4px">Foto do produto. Aparece redonda ao lado do nome.</div></div></div>
 <div class="frow"><label class="f" style="grid-column:span 2">Nome do produto<input type="text" id="pr-nome" value="${esc(EP.nome)}" placeholder="Ex.: Brigadeiro de pistache 20 g"></label>
  <label class="f">Categoria<input type="text" id="pr-cat" list="pr-cats" value="${esc(EP.cat)}"><datalist id="pr-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label></div>
 <label class="f">Grupo na página de pedidos (opcional)<input type="text" id="pr-grupo" list="pr-grupos" value="${esc(EP.grupo||'')}" placeholder="Ex.: Brownies, Pudins, Bolos"><datalist id="pr-grupos">${[...new Set(S.produtos.map(p=>p.grupo).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><span class="small muted">Produtos com o mesmo grupo aparecem juntos para a cliente, dentro da categoria.</span></label>
 <div class="frow"><label class="f">Preço de venda (R$)<input type="text" inputmode="decimal" id="pr-preco" value="${n2(EP.preco)}" oninput="prUpd()"></label>
  <label class="f" id="pr-tempo-w" ${man?'hidden':''}>Tempo de produção por unidade (min)<input type="text" inputmode="decimal" id="pr-tempo" value="${nq(EP.tempo)}" oninput="prUpd()"></label>
  <div style="display:flex;flex-direction:column;gap:6px;justify-content:flex-end"><label class="chk" ${modOn('capacidade')?'':'hidden'}><input type="checkbox" id="pr-cap" ${EP.contaCap?'checked':''}> Conta na capacidade diária</label><label class="chk"><input type="checkbox" id="pr-ativo" ${EP.ativo!==false?'checked':''}> Produto ativo</label><label class="chk"><input type="checkbox" id="pr-catalogo" ${(EP.catalogo??(EP.cat!=='Adicionais'))?'checked':''}> Aparece no catálogo</label></div></div>
 <label class="f">Descrição para o catálogo <small>(opcional, uma frase curta)</small><input type="text" id="pr-desc" maxlength="90" value="${esc(EP.desc||'')}" placeholder="Ex.: Brigadeiro cremoso de chocolate com granulado belga"></label>
 <div class="frow"><label class="f">Pedido mínimo na página de pedidos <small>(unidades; deixe em branco se não houver)</small><input type="text" inputmode="numeric" id="pr-min" value="${EP.minimo?nq(EP.minimo):''}" placeholder="Sem mínimo"></label></div>
 <div class="sec">Repasse</div>
 <label class="chk"><input type="checkbox" id="pr-rep" ${EP.repasse?'checked':''} onchange="$('#pr-parc-w').hidden=!this.checked"> Produto de repasse (feito por outra pessoa; o valor vendido não é receita da loja)</label>
 <label class="f" id="pr-parc-w" ${EP.repasse?'':'hidden'} style="margin-top:8px">Repassar para<input type="text" id="pr-parc" list="pr-parcs" value="${esc(EP.parceiro||'')}" placeholder="Nome de quem produz"><datalist id="pr-parcs">${[...new Set(S.produtos.map(p=>p.parceiro).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><small>As vendas deste produto ficam fora do faturamento e da margem, e aparecem em Financeiro, na aba Repasses. O custo informado abaixo é ignorado.</small></label>
 <div class="sec">Vende em</div>
 <div style="display:flex;gap:16px;flex-wrap:wrap">${Object.entries(FRENTES).map(([k,l])=>`<label class="chk"><input type="checkbox" id="pr-fr-${k}" ${(EP.nome?frentesDe(EP):(EP.frentes||[])).includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
 <div class="small muted" style="margin-top:4px">Marque onde este produto ou serviço é vendido. Ele só aparece nas frentes marcadas. Sem nenhuma marcada, o sistema decide pela categoria.</div>
 <div class="sec">Como informar o custo</div>
 <div class="tabs" style="margin-bottom:0"><button id="pr-m-manual" class="${man?'on':''}" onclick="prModo('manual')">Custo manual</button><button id="pr-m-ficha" class="${man?'':'on'}" ${modOn('ficha')||!man?'':'hidden'} onclick="prModo('ficha')">Ficha técnica</button></div>
 <div id="pr-manual" ${man?'':'hidden'}><div class="frow"><label class="f">Custo por unidade (R$)<input type="text" inputmode="decimal" id="pr-custo" value="${n2(EP.custoManual||0)}" oninput="prUpd()"></label></div>
  <div class="small muted" style="margin-top:6px">Digite quanto custa fazer uma unidade, já com ingredientes e embalagem. É o jeito mais rápido de começar. Depois você pode trocar para a ficha técnica, que calcula o custo sozinha pelos insumos.</div></div>
 <div id="pr-ficha" ${man?'hidden':''} style="display:flex;flex-direction:column;gap:12px">
 <div class="crow irow h" style="display:grid"><span>Tipo</span><span>Item</span><span>Quantidade</span><span class="cc" style="text-align:right">Custo</span><span></span></div>
 <div id="pr-itens" class="list" style="gap:8px"></div>
 <div class="actions"><button class="btn sm" onclick="prAdd('r')">${ico('plus')}Receita base</button><button class="btn sm" onclick="prAdd('i')">${ico('plus')}Insumo ou embalagem</button><button class="btn sm" onclick="prAdd('p')">${ico('plus')}Outro produto (kit)</button></div>
 </div>
 <div class="inner" id="pr-res"></div>`;
 openModal(id?EP.nome:'Novo produto',body,`${id?`<button class="btn ghost danger sp" onclick="excluirProduto('${id}')">Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="prSalvar()">Salvar produto</button>`,true);
 prItens();
}
function prItemOpts(it){if(it.t==='r')return S.receitas.map(r=>`<option value="${r.id}" ${r.id===it.id?'selected':''}>${esc(r.nome)}</option>`).join('');if(it.t==='i')return S.insumos.map(i=>`<option value="${i.id}" ${i.id===it.id?'selected':''}>${esc(i.nome)}</option>`).join('');return prodOptions(it.id,EP.id)}
function unItem(it){return it.t==='r'?'g':it.t==='i'?(getIns(it.id)||{}).un||'':'un'}
function custoItem(it){if(it.t==='i'){const i=getIns(it.id);return i?it.q*custoUnitIns(i):0}if(it.t==='r'){const r=getRec(it.id);return r?it.q*custoReceita(r).porG:0}const p=getProd(it.id);if(!p)return 0;const c=custoProduto(p);return it.q*(c.mat+c.mo)}
function prItens(){
 const T={r:'Receita',i:'Insumo',p:'Produto'};
 $('#pr-itens').innerHTML=EP.itens.map((it,i)=>`<div class="crow"><span class="small strong muted">${T[it.t]}</span><select id="pr-it-${i}" onchange="EP.itens[${i}].id=this.value;prItens()">${prItemOpts(it)}</select>
  <div style="display:flex;align-items:center;gap:4px"><input type="text" inputmode="decimal" id="pr-q-${i}" value="${nq(it.q)}" oninput="EP.itens[${i}].q=num(this.value);prUpd()"><span class="small muted">${unItem(it)}</span></div>
  <span class="cc num" id="pr-c-${i}" style="text-align:right">${brl(custoItem(it))}</span><button class="x" title="Remover" onclick="EP.itens.splice(${i},1);prItens()">${ico('x','width="16" height="16"')}</button></div>`).join('')||'<div class="muted small">Adicione receitas base, insumos e embalagens para calcular o custo.</div>';
 prUpd();
}
function prAdd(t){const id=t==='r'?S.receitas[0]?.id:t==='i'?S.insumos[0]?.id:S.produtos.find(p=>p.id!==EP.id)?.id;if(!id)return toast('Nenhum item desse tipo cadastrado.','bad');EP.itens.push({t,id,q:t==='r'?20:1});prItens()}
function prModo(m){EP.modoCusto=m;const man=m==='manual';$('#pr-manual').hidden=!man;$('#pr-ficha').hidden=man;$('#pr-tempo-w').hidden=man;$('#pr-m-manual').classList.toggle('on',man);$('#pr-m-ficha').classList.toggle('on',!man);prUpd()}
function prUpd(){
 EP.preco=num($('#pr-preco').value);EP.tempo=num($('#pr-tempo').value);EP.custoManual=num($('#pr-custo').value);EP.itens.forEach((it,i)=>{const e=$('#pr-c-'+i);if(e)e.textContent=brl(custoItem(it))});
 const c=custoProduto(EP);const m=margem(EP.preco,c.total);const sug=precoSugerido(c.total);const sugMin=precoSugerido(c.total,CFG().margemMin);
 $('#pr-res').innerHTML=`<div class="lbl">${EP.modoCusto==='manual'?'Resultado por unidade':'Composição do custo por unidade'}</div><div class="kv">
  ${EP.modoCusto==='manual'?'':`<div><span>Materiais</span><b>${brl(c.mat)}</b></div><div><span>Mão de obra</span><b>${brl(c.mo)}</b></div><div><span>Indiretos (${CFG().indireto}%)</span><b>${brl(c.ind)}</b></div>`}
  <div><span>Custo total</span><b>${brl(c.total)}</b></div><div><span>Impostos e taxas</span><b>${brl(EP.preco*deducoes())}</b></div><div><span>Lucro por unidade</span><b class="${m<0?'down':''}">${brl(EP.preco*(1-deducoes())-c.total)}</b></div>
  <div><span>Margem atual</span><b>${mgChip(m)}</b></div><div><span>Preço mínimo (${CFG().margemMin}%)</span><b>${brl(sugMin)}</b></div><div><span>Preço sugerido (${CFG().margemAlvo}%)</span><b>${brl(sug)}</b></div></div>
  <div style="margin-top:10px"><button class="btn sm" onclick="$('#pr-preco').value=n2(${sug.toFixed(2)});prUpd()">Usar preço sugerido</button></div>`;
}
function prSalvar(){
 const nome=$('#pr-nome').value.trim();if(!nome)return toast('Informe o nome do produto.','bad');
 Object.assign(EP,{nome,cat:$('#pr-cat').value.trim()||'Outros',contaCap:$('#pr-cap').checked,ativo:$('#pr-ativo').checked,catalogo:$('#pr-catalogo').checked,frentes:Object.keys(FRENTES).filter(k=>$('#pr-fr-'+k).checked),minimo:Math.max(0,Math.round(num($('#pr-min').value)))||0,repasse:$('#pr-rep').checked,parceiro:$('#pr-rep').checked?($('#pr-parc').value.trim()||'Parceiro'):'',desc:$('#pr-desc').value.trim(),grupo:$('#pr-grupo').value.trim()});
 if(!EP.id){EP.id=uid('p');S.produtos.push(EP)}else{S.produtos[S.produtos.findIndex(p=>p.id===EP.id)]=EP}
 save();closeModal();render();toast('Produto salvo');
}
function excluirProduto(id){
 const uso=S.pedidos.some(p=>ativo(p)&&p.itens.some(x=>x.p===id))||S.produtos.some(p=>p.itens.some(x=>x.t==='p'&&x.id===id));
 if(uso)return toast('Esse produto está em pedidos em andamento ou em um kit. Marque como inativo.','bad');
 askConfirm('Excluir este produto?','Excluir',()=>{S.produtos=S.produtos.filter(p=>p.id!==id);save();closeModal();render()},'Voltar');
}

/* ============ RECEITAS ============ */
R.receitas=()=>head('Receitas base','Massas, recheios e caldas que entram em vários produtos. Quando um insumo muda de preço, todos os produtos que usam a receita são recalculados.',`<button class="btn pri" onclick="abrirReceita()">${ico('plus')}Nova receita</button>`)
 +`<div class="grid g3">${S.receitas.map(r=>{const c=custoReceita(r);const usos=S.produtos.filter(p=>p.itens.some(x=>x.t==='r'&&x.id===r.id)).length;
 return`<button class="card" style="text-align:left;cursor:pointer" onclick="abrirReceita('${r.id}')"><div style="font-size:16px;font-weight:700;line-height:1.3;margin-bottom:12px">${esc(r.nome)}</div>
 <div class="kv"><div><span>Rende</span><b>${nq(c.util)} g</b></div><div><span>Custo da receita</span><b>${brl(c.total)}</b></div><div><span>Custo por kg</span><b>${brl(c.porG*1000)}</b></div><div><span>Em 20 g</span><b>${brl(c.porG*20)}</b></div></div>
 <div class="small muted" style="margin-top:10px">${r.itens.length} ingredientes · usada em ${usos} produto${usos===1?'':'s'} · perda de ${nq(r.perda)}%</div></button>`}).join('')}</div>`;
let ER=null;
function abrirReceita(id){
 ER=id?clone(getRec(id)):{id:'',nome:'',rendimento:1000,perda:5,itens:[]};
 openModal(id?ER.nome:'Nova receita',`<div class="frow"><label class="f" style="grid-column:span 2">Nome<input type="text" id="rc-nome" value="${esc(ER.nome)}"></label>
 <label class="f">Rendimento (g)<input type="text" inputmode="decimal" id="rc-rend" value="${nq(ER.rendimento)}" oninput="ER.rendimento=num(this.value);rcUpd()"></label>
 <label class="f">Perda no preparo (%)<input type="text" inputmode="decimal" id="rc-perda" value="${nq(ER.perda)}" oninput="ER.perda=num(this.value);rcUpd()"></label></div>
 <div class="sec">Ingredientes</div><div id="rc-itens" class="list" style="gap:8px"></div>
 <div><button class="btn sm" onclick="if(!S.insumos.length)return toast('Cadastre um insumo antes.','bad');ER.itens.push({id:S.insumos[0].id,qtd:100});rcItens()">${ico('plus')}Adicionar ingrediente</button></div><div class="inner" id="rc-res"></div>`,
 `${id?`<button class="btn ghost danger sp" onclick="excluirReceita('${id}')">Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="rcSalvar()">Salvar receita</button>`,true);
 rcItens();
}
function rcItens(){
 $('#rc-itens').innerHTML=ER.itens.map((g,i)=>{const ins=getIns(g.id)||{};return`<div class="irow" style="grid-template-columns:minmax(0,1fr) 120px 100px 36px"><select id="rc-i-${i}" onchange="ER.itens[${i}].id=this.value;rcItens()">${S.insumos.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
 <div style="display:flex;align-items:center;gap:4px"><input type="text" inputmode="decimal" id="rc-q-${i}" value="${nq(g.qtd)}" oninput="ER.itens[${i}].qtd=num(this.value);rcUpd()"><span class="small muted">${ins.un||''}</span></div>
 <span class="num" id="rc-c-${i}" style="text-align:right">${brl(g.qtd*(ins.id?custoUnitIns(ins):0))}</span><button class="x" title="Remover" onclick="ER.itens.splice(${i},1);rcItens()">${ico('x','width="16" height="16"')}</button></div>`}).join('')||'<div class="muted small">Sem ingredientes.</div>';
 rcUpd();
}
function rcUpd(){ER.itens.forEach((g,i)=>{const e=$('#rc-c-'+i),ins=getIns(g.id);if(e&&ins)e.textContent=brl(g.qtd*custoUnitIns(ins))});const c=custoReceita(ER);
 $('#rc-res').innerHTML=`<div class="kv"><div><span>Custo da receita</span><b>${brl(c.total)}</b></div><div><span>Rendimento útil</span><b>${nq(c.util)} g</b></div><div><span>Custo por grama</span><b>${brl(c.porG)}</b></div><div><span>Custo por kg</span><b>${brl(c.porG*1000)}</b></div></div>`}
function rcSalvar(){const nome=$('#rc-nome').value.trim();if(!nome)return toast('Informe o nome da receita.','bad');if(!(ER.rendimento>0))return toast('Informe o rendimento em gramas.','bad');ER.nome=nome;
 if(!ER.id){ER.id=uid('r');S.receitas.push(ER)}else S.receitas[S.receitas.findIndex(r=>r.id===ER.id)]=ER;save();closeModal();render();toast('Receita salva')}
function excluirReceita(id){if(S.produtos.some(p=>p.itens.some(x=>x.t==='r'&&x.id===id)))return toast('Essa receita é usada em produtos. Remova dos produtos antes.','bad');askConfirm('Excluir esta receita?','Excluir',()=>{S.receitas=S.receitas.filter(r=>r.id!==id);save();closeModal();render()},'Voltar')}

/* ============ INSUMOS ============ */
R.insumos=()=>{
 const cats=['Todos',...new Set(S.insumos.map(i=>i.cat))];const b=UI.insBusca.toLowerCase();
 const L=S.insumos.filter(i=>(UI.insCat==='Todos'||i.cat===UI.insCat)&&(!b||i.nome.toLowerCase().includes(b)));
 const val=S.insumos.reduce((s,i)=>s+i.estoque*custoUnitIns(i),0);const baixo=S.insumos.filter(i=>i.estoque<i.minimo).length;
 return head('Insumos e estoque','Preço de compra por embalagem, custo por grama ou unidade e estoque atual. O estoque baixa sozinho quando um pedido entra em produção e sobe quando você lança uma compra.',`<button class="btn" onclick="abrirInsumo()">${ico('plus')}Novo insumo</button><button class="btn pri" onclick="lancarCompra()">${ico('compras')}Lançar compra</button>`)
 +`<div class="grid g3" style="margin-bottom:16px"><div class="card kpi"><div class="l">Valor em estoque</div><div class="v num">${brl(val)}</div></div><div class="card kpi"><div class="l">Insumos cadastrados</div><div class="v num">${S.insumos.length}</div></div><div class="card kpi"><div class="l">Abaixo do mínimo</div><div class="v num ${baixo?'down':''}">${baixo}</div></div></div>
 <div class="toolbar"><input type="search" class="search" id="ins-busca" placeholder="Buscar insumo" value="${esc(UI.insBusca)}" oninput="UI.insBusca=this.value;rerenderKeep('ins-busca')"><div class="chips">${cats.map(c=>`<button class="chip ${UI.insCat===c?'on':''}" onclick="UI.insCat='${c}';render()">${esc(c)}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th class="r">Embalagem</th><th class="r">Preço</th><th class="r">Custo unitário</th><th class="r">Estoque</th><th class="r">Mínimo</th><th>Situação</th></tr></thead><tbody>
 ${L.map(i=>{const h=i.hist||[];const ant=h.length>1?h[h.length-2].preco:null;const v=ant?(i.precoEmb-ant)/ant:0;
 return`<tr class="click" onclick="abrirInsumo('${i.id}')"><td><div class="nm">${avatar(i)}<div><b>${esc(i.nome)}</b><br><span class="small muted">${esc(i.cat)} · ${esc(i.fornecedor||'')}</span></div></div></td><td class="r">${nq(i.qtdEmb)} ${i.un}</td><td class="r">${brl(i.precoEmb)}${v>0.005?`<br><span class="small down">+${pct(v)}</span>`:''}</td>
 <td class="r">${brl(custoUnitIns(i)*(i.un==='un'?1:1000))}<span class="small muted">/${i.un==='un'?'un':i.un==='g'?'kg':'L'}</span></td><td class="r">${nq(i.estoque)} ${i.un}</td><td class="r">${nq(i.minimo)} ${i.un}</td>
 <td>${i.estoque<i.minimo?'<span class="mg bad">Repor</span>':i.estoque<i.minimo*1.3?'<span class="mg warn">Atenção</span>':'<span class="mg ok">Ok</span>'}</td></tr>`}).join('')}</tbody></table></div>
 <div class="card" style="margin-top:18px"><h3>Compras lançadas <button class="btn sm" onclick="lancarCompra()">${ico('plus')}Lançar compra</button></h3>
 ${(S.compras||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>Itens</th><th class="r">Total</th></tr></thead><tbody>${[...S.compras].sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id)).slice(0,20).map(c=>`<tr class="click" onclick="verCompra('${c.id}')"><td class="num">${dBR(c.data)}</td><td>${esc(c.fornecedor||'Sem fornecedor')}</td><td class="small">${c.itens.map(x=>esc((getIns(x.id)||{}).nome||'?')).slice(0,3).join(', ')}${c.itens.length>3?` e mais ${c.itens.length-3}`:''}</td><td class="r">${brl(c.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma compra lançada ainda. Use "Lançar compra" para dar entrada no estoque e atualizar os custos pela nota.</div>'}</div>`;
};
let EIF='';
function abrirInsumo(id){
 const i=id?getIns(id):{id:'',nome:'',cat:'Ingredientes',un:'g',qtdEmb:1000,precoEmb:0,estoque:0,minimo:0,fornecedor:'',hist:[]};
 const usos=id?S.produtos.filter(p=>custoProduto(p,{[id]:2}).total-custoProduto(p).total>0.00001).map(p=>p.nome):[];
 EIF=i.foto||'';
 openModal(id?i.nome:'Novo insumo',`<div class="foto-ed"><span id="in-foto">${avatar(i,'lg')}</span><div><div class="actions"><label class="btn sm" style="cursor:pointer">${i.foto?'Trocar foto':'Enviar foto'}<input type="file" id="in-foto-in" accept="image/png,image/jpeg,image/webp" hidden onchange="lerImagem(this,{max:240,quadrado:true},f=>{EIF=f;$('#in-foto').innerHTML=avatar({nome:$('#in-nome').value,foto:f},'lg')})"></label><button class="btn sm ghost danger" onclick="EIF='';$('#in-foto').innerHTML=avatar({nome:$('#in-nome').value},'lg')">Remover</button></div><div class="small muted" style="margin-top:4px">Foto da embalagem ajuda a reconhecer na hora da compra.</div></div></div>
 <div class="frow"><label class="f" style="grid-column:span 2">Nome<input type="text" id="in-nome" value="${esc(i.nome)}"></label>
 <label class="f">Categoria<select id="in-cat">${['Ingredientes','Decoração','Embalagens'].map(c=>`<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}</select></label></div>
 <div class="frow"><label class="f">Unidade de medida<select id="in-un">${[['g','gramas (g)'],['ml','mililitros (ml)'],['un','unidades (un)']].map(([k,v])=>`<option value="${k}" ${k===i.un?'selected':''}>${v}</option>`).join('')}</select></label>
 <label class="f">Quantidade na embalagem<input type="text" inputmode="decimal" id="in-qe" value="${nq(i.qtdEmb)}"></label>
 <label class="f">Preço da embalagem (R$)<input type="text" inputmode="decimal" id="in-pe" value="${n2(i.precoEmb)}"></label></div>

const CATS_SAIDA=['Insumos','Embalagens','Despesas fixas','Impostos','Marketing','Equipamentos','Pró-labore','Outros'];
function dreMes(k){
 const ent=S.pedidos.filter(p=>p.status==='entregue'&&p.dataEntrega.slice(0,7)===k);let rec=0,mat=0,mo=0,recEst=0;
 for(const p of ent){const t=totaisDoc(p);rec+=t.rec;mat+=t.mat;mo+=t.mo;if(frenteDe(p)==='estacao')recEst+=t.rec}
 const ck=carrinhoMes(k);const recEnc=rec;rec+=ck.rec;mat+=ck.mat;mo+=ck.mo;
 const imp=rec*CFG().imposto/100,tx=ent.reduce((s,p)=>s+taxasVendas(p.pagamentos||[]),0)+taxasVendas(vendasCarrinhoPeriodo(k+'-01',k+'-31').map(x=>x.v));const mc=rec-imp-tx-mat;
 const desp=S.lancamentos.filter(l=>l.tipo==='saida'&&l.data.slice(0,7)===k&&!['Insumos','Embalagens','Repasse'].includes(l.cat));
 const pl=desp.filter(l=>l.cat==='Pró-labore').reduce((s,l)=>s+l.valor,0);const dsp=desp.reduce((s,l)=>s+l.valor,0)-pl;
 const mcp=rec>0?mc/rec:0;const pe=mcp>0?(dsp+pl)/mcp:null;
 return{n:ent.length,recEnc,recEst,recCar:ck.rec,rec,imp,tx,mat,mc,dsp,pl,res:mc-dsp,mo,final:mc-dsp-pl-mo,desp,mcp,pe};
}
function caixaMes(k){
 const ent=[];for(const p of S.pedidos)for(const g of p.pagamentos||[])if(g.data.slice(0,7)===k)ent.push({data:g.data,desc:`Pedido #${p.num} · ${nomeCli(p.cliente)} (${g.tipo.toLowerCase()}, ${g.forma})`,valor:g.valor,tipo:'entrada',cat:'Vendas'});
 for(const c of S.carrinhos||[]){const g={};for(const v of c.vendas)if(v.data.slice(0,7)===k){const kk=v.data+'|'+v.forma;g[kk]=(g[kk]||0)+v.total}
  for(const[kk,val]of Object.entries(g)){const[dt,f]=kk.split('|');ent.push({data:dt,desc:`Carrinho da noite (${f})`,valor:+val.toFixed(2),tipo:'entrada',cat:'Carrinho',car:c.id})}}
 for(const l of S.lancamentos)if(l.data.slice(0,7)===k)ent.push({...l});
 return ent.sort((a,b)=>b.data.localeCompare(a.data));
}
R.financeiro=()=>{
 const k=UI.finMes||hoje().slice(0,7);const d=dreMes(k);const cx=caixaMes(k);
 const inn=cx.filter(x=>x.tipo==='entrada').reduce((s,x)=>s+x.valor,0),out=cx.filter(x=>x.tipo==='saida').reduce((s,x)=>s+x.valor,0);
 const receber=S.pedidos.filter(p=>p.status!=='cancelado'&&totaisDoc(p).saldo>0.009).sort((a,b)=>a.dataEntrega.localeCompare(b.dataEntrega));
 const an=modOn('analise');if(!an&&UI.finTab==='resumo')UI.finTab='caixa';const rf=recFrente(k);const aRec=receber.reduce((s,p)=>s+totaisDoc(p).saldo,0);
 const tabs=[...(an?[['resumo','Resultado do mês']]:[]),['caixa','Entradas e saídas'],['receber',`A receber (${receber.length})`],...(temRepasse()?[['repasse','Repasses']]:[])];const rpm=repasses(k+'-01',k+'-31');const rpTot=Object.values(rpm).reduce((s,x)=>s+x.vend,0);
 let body='';
 if(UI.finTab==='resumo'){const r=v=>d.rec>0?`<span class="small muted" style="margin-left:8px">${pct(v/d.rec)}</span>`:'';
  body=`<div class="grid g21"><div class="card"><h3>Resultado de ${mesLabel(k)}</h3><table class="dre">

  <tr class="sub"><td>(-) Taxas de cartão (débito ${nq(txD())}%, crédito ${nq(txC())}%)</td><td>${brl(-d.tx)}</td></tr>

  <tr class="tot"><td>Margem de contribuição</td><td>${brl(d.mc)}${r(d.mc)}</td></tr>
  <tr class="sub"><td>(-) Despesas do mês (gás, energia, DAS, marketing...)</td><td>${brl(-d.dsp)}</td></tr>
  <tr class="tot"><td>Resultado antes do pró-labore</td><td>${brl(d.res)}${r(d.res)}</td></tr>
  <tr class="sub"><td>(-) Pró-labore (retirada da dona)</td><td>${brl(-d.pl)}</td></tr>
  ${d.mo>0?`<tr class="sub"><td>(-) Mão de obra pelas horas trabalhadas (${brl(CFG().custoHora)}/h)</td><td>${brl(-d.mo)}</td></tr>`:''}
  <tr class="tot"><td>Lucro da confeitaria</td><td>${brl(d.final)}${r(d.final)}</td></tr></table>
  <p class="small muted" style="margin:12px 0 0">Compras de insumos e embalagens aparecem em Entradas e saídas. No resultado, entra o custo do que foi efetivamente vendido, pela ficha técnica.</p></div>
  <div class="grid" style="align-content:start"><div class="card kpi"><div class="l">Ponto de equilíbrio do mês</div><div class="v num">${d.pe!=null?brl(d.pe):'sem dados'}</div><div class="d">${d.pe==null?'Aparece quando houver vendas e despesas lançadas no mês.':d.rec>=d.pe?`<span class="up">Já passou em ${brl(d.rec-d.pe)}</span>. A partir daqui, cada venda vira lucro.`:`<span class="down">Faltam ${brl(d.pe-d.rec)} em vendas</span> para pagar as despesas e o pró-labore.`}</div></div><div class="card kpi"><div class="l">Recebido no mês</div><div class="v num up">${brl(inn)}</div></div><div class="card kpi"><div class="l">Pago no mês</div><div class="v num down">${brl(out)}</div></div><div class="card kpi"><div class="l">Saldo do caixa no mês</div><div class="v num">${brl(inn-out)}</div></div></div></div>`}
 else if(UI.finTab==='caixa'){body=`<div class="toolbar"><button class="btn pri" onclick="novoLanc()">${ico('plus')}Lançar despesa ou entrada</button><button class="btn" onclick="recorrentes()">Despesas fixas${(CFG().recorrentes||[]).length?` (${CFG().recorrentes.length})`:''}</button><span class="muted small">Pagamentos de pedidos entram automaticamente. Clique duas vezes em uma linha de carrinho para ver a conciliação.</span></div>
  ${cx.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th></th></tr></thead><tbody>${cx.map(x=>`<tr ${x.car?`class="click" title="Clique duas vezes para ver a conciliação" ondblclick="verCarrinho('${x.car}')"`:''}><td class="num">${dCurto(x.data)}</td><td>${esc(x.desc)}${x.car?` <button class="btn sm ghost" style="padding:2px 8px" onclick="verCarrinho('${x.car}')">ver</button>`:''}</td><td class="small muted">${esc(x.cat)}</td><td class="r ${x.tipo==='entrada'?'up':'down'}">${x.tipo==='entrada'?'':'- '}${brl(x.valor)}</td><td>${x.id?`<button class="x" title="Excluir lançamento" onclick="delLanc('${x.id}')">${ico('x','width="16" height="16"')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma movimentação neste mês.</div>'}`}
 else if(UI.finTab==='repasse'){body=repassesView(k,rpm)}
 else{body=receber.length?`<div class="tbl-wrap"><table><thead><tr><th>Pedido</th><th>Entrega</th><th>Situação</th><th class="r">Total</th><th class="r">Pago</th><th class="r">Saldo</th></tr></thead><tbody>${receber.map(p=>{const t=totaisDoc(p);return`<tr class="click" onclick="verPedido('${p.id}')"><td><b>#${p.num}</b> ${esc(nomeCli(p.cliente))}</td><td>${dBR(p.dataEntrega)}</td><td>${pill(p.status)}</td><td class="r">${brl(t.total)}</td><td class="r">${brl(t.pago)}</td><td class="r down"><b>${brl(t.saldo)}</b></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nada a receber.</div>'}
 return head('Financeiro','Resultado por mês pelos pedidos entregues, caixa com tudo que entrou e saiu e o que ainda falta receber.',`<div style="display:flex;gap:6px;align-items:center"><button class="btn sm" onclick="UI.finMes=addMes('${k}',-1);render()" aria-label="Mês anterior">‹</button><span class="strong" style="min-width:150px;text-align:center">${mesLabel(k)}</span><button class="btn sm" onclick="UI.finMes=addMes('${k}',1);render()" aria-label="Próximo mês">›</button>${ADMIN()?`<button class="btn sm pri" onclick="fechamentoPDF('${k}')">${ico('pdf')}Fechamento</button>`:''}</div>`)
 +`<div class="card" style="margin-bottom:16px"><h3>Vendido em ${mesLabel(k)}</h3><div class="etapas">${[['carrinho','Carrinho'],['estacao','Estação Gourmet'],['encomenda','Encomendas']].map(([f,l])=>`<button class="etapa" title="Ver o resumo do mês" onclick="resumoFrente('${f}','${k}')"><span>${l}</span><b class="num">${brl(rf[f])}</b></button>`).join('')}<button class="etapa" title="Ver o resumo do mês" onclick="resumoFrente('tudo','${k}')"><span class="strong">Total</span><b class="num">${brl(rf.carrinho+rf.estacao+rf.encomenda)}</b></button><button class="etapa" onclick="UI.finTab='receber';render()"><span>A receber</span><b class="num">${brl(aRec)}</b></button>${rpTot>0?`<button class="etapa" onclick="UI.finTab='repasse';render()"><span>Repasse <span class="small muted">(não é da loja)</span></span><b class="num">${brl(rpTot)}</b></button>`:''}</div></div>

/* resumo do mês por frente, aberto pelos quadros do Financeiro */
function resumoFrente(fr,k){const L=(l,v,o={})=>`<tr class="${o.t?'tot':'sub'}"><td>${l}</td><td class="${o.c||''}">${v}</td></tr>`;let h='';const mes=MESES[+k.slice(5)-1];
 if(fr==='carrinho'||fr==='tudo'){const cs=(S.carrinhos||[]).filter(c=>c.abertura.slice(0,7)===k).sort((a,b)=>b.abertura.localeCompare(a.abertura)).map(c=>({c,r:carResumo(c)}));const sm=f=>cs.reduce((s,x)=>s+f(x),0);const tot=sm(x=>x.r.total),rp=sm(x=>x.r.rep),din=sm(x=>x.r.porForma.Dinheiro||0),dif=sm(x=>x.c.status==='fechado'?(x.c.difCaixa||0):0);
  h+=`<div class="sec" style="margin-top:0">Carrinho em ${mes}</div><div class="grid g2"><div class="card" style="padding:14px"><h3>Resumo do valor</h3><table class="dre">${L('Total vendido',brl(tot),{t:1})}${L('(-) Repasse a parceiros',brl(-rp))}${L('Vendas da loja',brl(tot-rp),{t:1})}${L('(-) Taxas de cartão',brl(-sm(x=>x.r.taxas)))}${L('(-) Custo dos produtos vendidos e perdas',brl(-sm(x=>x.r.custo)))}${L('Lucro estimado',brl(sm(x=>x.r.lucro)),{t:1})}</table></div>
  <div class="card" style="padding:14px"><h3>Conciliação</h3><table class="dre">${['Pix','Dinheiro','Débito','Crédito'].map(f=>L('Recebido em '+f,brl(sm(x=>x.r.porForma[f]||0)))).join('')}${L('Total recebido',brl(tot),{t:1})}${L(Math.abs(dif)<0.01?'Caixas conferidos, sem diferença':dif>0?'Sobra de caixa no mês':'Falta de caixa no mês',brl(Math.abs(dif)),{t:1,c:Math.abs(dif)<0.01?'up':'down'})}</table><div class="small muted" style="margin-top:8px">${cs.length} noite${cs.length===1?'':'s'} · ${nq(sm(x=>x.r.vend))} de ${nq(sm(x=>x.r.saiu))} produtos vendidos</div></div></div>

 return`<div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>O que a dona da loja vê</h3><p class="small muted" style="margin-top:-4px">Só o administrador enxerga este quadro. Ligue um módulo quando ela estiver pronta para usar; desligado, ele some do menu dela e continua disponível para você.</p>
  ${Object.entries(MODS).map(([k,l])=>`<label class="chk" style="margin:8px 0"><input type="checkbox" ${m[k]?'checked':''} onchange="const c=CFG();c.mod={...(c.mod||{}),${k}:this.checked};save();toast('Acesso atualizado')"> ${l}</label>`).join('')}</div>
 ${NUVEM?`<div class="card"><h3>Backup automático</h3><p class="small muted" style="margin-top:-4px">O sistema guarda sozinho uma cópia por dia, dos últimos 7 dias em que alguém usou. Se algo for apagado por engano, restaure daqui.</p><div class="actions"><button class="btn" onclick="verBackups()">Ver cópias e restaurar</button><button class="btn" onclick="backupDiario(true).then(ok=>toast(ok?'Cópia de hoje guardada':'Não foi possível guardar a cópia agora',ok?undefined:'bad'))">Guardar cópia agora</button></div></div>`:''}</div>`}
async function backupDiario(forcar){
 if(!NUVEM||!LOJA)return false;
 try{const vazioS=!S.produtos.length&&!S.pedidos.length&&!(S.carrinhos||[]).length&&!S.clientes.length;if(vazioS)return false; /* nunca troca uma cópia boa por um sistema zerado */
  const hj=hoje();if(!forcar){const r=await sb.from('dados').select('chave,dia:valor->>dia').eq('loja_id',LOJA).like('chave','backup:%');if(r.error)return false;if((r.data||[]).some(x=>x.dia===hj))return false}
  const r2=await sb.from('dados').upsert([{loja_id:LOJA,chave:'backup:'+new Date().getDay(),valor:{dia:hj,hora:agoraHM(),por:nomeUsuario(),dados:particionar()},atualizado_em:new Date().toISOString(),atualizado_por:USER.id}]);return!r2.error}catch(e){return false}}
async function verBackups(){
 openModal('Cópias de segurança','<div class="muted">Carregando...</div>','<button class="btn" onclick="closeModal()">Fechar</button>');
 let L=[];try{const r=await sb.from('dados').select('chave,dia:valor->>dia,hora:valor->>hora,por:valor->>por').eq('loja_id',LOJA).like('chave','backup:%');if(r.error)throw r.error;L=(r.data||[]).filter(x=>x.dia).sort((a,b)=>b.dia.localeCompare(a.dia))}catch(e){return openModal('Cópias de segurança','<div class="down">Não consegui carregar as cópias. Verifique a internet.</div>','<button class="btn" onclick="closeModal()">Fechar</button>')}
 openModal('Cópias de segurança',L.length?`<p class="small muted" style="margin:0 0 10px">Restaurar troca tudo o que está no sistema pelo que havia naquele dia.</p>`+L.map(b=>`<div class="alert" style="align-items:center"><div style="flex:1"><b>${SEMLONGO[toDate(b.dia).getDay()]}, ${dBR(b.dia)}</b><br><span class="small muted">${b.hora?'às '+esc(b.hora):''}${b.por?' · '+esc(b.por):''}</span></div><button class="btn sm" onclick="restaurarBackup('${b.chave}','${b.dia}')">Restaurar</button></div>`).join(''):'<div class="muted">Ainda não há cópias guardadas. A primeira é feita no próximo acesso com dados lançados.</div>','<button class="btn" onclick="closeModal()">Fechar</button>')}
function restaurarBackup(chave,dia){askConfirm(`Restaurar a cópia de ${dBR(dia)}? Tudo o que foi lançado depois dessa cópia será perdido.`,'Restaurar',async()=>{
 try{const r=await sb.from('dados').select('valor').eq('loja_id',LOJA).eq('chave',chave);if(r.error||!r.data||!r.data[0])throw 0;const dd=r.data[0].valor.dados;if(!dd||!dd.produtos)throw 0;
  for(const[k,v]of Object.entries(dd))aplicarChave(k,v);save();closeModal();go('painel');toast('Cópia restaurada')}catch(e){closeModal();toast('Não foi possível restaurar essa cópia.','bad')}},'Voltar',()=>verBackups())}
function vazio(){const b=seed();return{versao:1,seq:2000,exemplo:false,config:{...b.config,proxPedido:1,proxOrc:1,whatsapp:''},compras:[],carrinhos:[],estoqueProntos:{},producoes:[],insumos:[],receitas:[],produtos:[],clientes:[],pedidos:[],orcamentos:[],lancamentos:[]}}
function zerar(tudo){
 for(const k of['pedidos','orcamentos','clientes','lancamentos','compras','carrinhos','producoes'])S[k]=[];S.estoqueProntos={};S.exemplo=false;S.config.proxPedido=1;S.config.proxOrc=1;TK={itens:{},forma:'Pix',recebido:''};
 if(tudo){S.insumos=[];S.receitas=[];S.produtos=[]}else for(const i of S.insumos)i.estoque=0;
 save();closeModal();go('painel');toast(tudo?'Sistema zerado. Comece cadastrando os seus produtos.':'Movimentações apagadas');
}
function salvarCfg(){const c=CFG();c.custoMetodo=$('#cf-custoMetodo').value;for(const k of['margemAlvo','margemMin','imposto','taxaDebito','taxaCredito','custoHora','indireto','capacidade','sinalPct','validade'])c[k]=num($('#cf-'+k).value);
 c.taxa=c.taxaCredito;if(c.margemAlvo+c.imposto+c.taxaCredito>=100)return toast('Margem, impostos e taxas somados precisam ficar abaixo de 100%.','bad');
