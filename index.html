 if(!NUVEM||!LOJA)return;if(_enviando){clearTimeout(_pend);_pend=setTimeout(enviar,400);return}
 const cur=particionar();const rows=[],strs={};
 for(const[k,v]of Object.entries(cur)){const s=canon(v);if(s!==_sync[k]){rows.push({loja_id:LOJA,chave:k,valor:v,atualizado_em:new Date().toISOString(),atualizado_por:USER.id});strs[k]=s}}
 if(!rows.length)return setSync('ok');
 _enviando=true;let erro=null;try{const r=await sb.from('dados').upsert(rows);erro=r.error}catch(e){erro=e}_enviando=false;
 if(erro){setSync('erro');clearTimeout(_pend);_pend=setTimeout(enviar,5000);return}
 for(const k in strs)_sync[k]=strs[k];
 setSync('ok');publicarVitrine();
}
function chegouRemoto(r){
 if(!r||r.loja_id!==LOJA||String(r.chave).startsWith('backup:'))return false;const s=canon(r.valor);if(s===_sync[r.chave])return false;
 const atual=canon(particionar()[r.chave]);if(_sync[r.chave]!==undefined&&atual!==_sync[r.chave])return false; /* tenho alteração minha ainda não enviada: ela prevalece */
 aplicarChave(r.chave,r.valor);_sync[r.chave]=s;return true;
}
function aposRemoto(){cacheLocal();if($('#modal-root').innerHTML)_remoto=true;else render()}
async function recarregar(){if(!NUVEM||!LOJA||_syncSt!=='ok')return;try{const{data,error}=await sb.from('dados').select('loja_id,chave,valor').eq('loja_id',LOJA).not('chave','like','backup:%');if(error||!data)return;let mudou=false;for(const r of data)if(chegouRemoto(r))mudou=true;if(mudou)aposRemoto()}catch(e){}carregarSite()}
function marcaLogin(){return`<div class="brand" style="border:0;padding-bottom:0"><div class="wm">GBR Connect</div><div class="sub">GESTÃO PARA CONFEITARIAS</div></div>`}
function mostrarApp(sim){$('.app').hidden=!sim;$('#bottomnav').hidden=!sim;$('#login').hidden=sim}
function telaLogin(msg){mostrarApp(false);
 $('#login').innerHTML=`<form class="login-card" onsubmit="event.preventDefault();fazerLogin()">${marcaLogin()}
  <label class="f">Usuário<input type="text" id="lg-email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label class="f">Senha<input type="password" id="lg-senha" autocomplete="current-password" required></label>
  <div id="lg-erro" class="small down">${msg?esc(msg):''}</div>
  <button class="btn pri" id="lg-btn" type="submit" style="padding:12px">Entrar</button>
  <p class="small muted" style="margin:0;text-align:center">Esqueceu a senha? Fale com a GBR Assessoria.</p></form>`}
function telaAviso(txt,botoes){mostrarApp(false);$('#login').innerHTML=`<div class="login-card">${marcaLogin()}<p style="margin:0;text-align:center">${txt}</p>${botoes||''}</div>`}
const DOMINIO_LOGIN='sweetka-gestao.app';
function emailDe(u){u=String(u||'').trim().toLowerCase();return u.includes('@')?u:u+'@'+DOMINIO_LOGIN}
function nomeUsuario(){const e=(USER&&USER.email)||'';return e.endsWith('@'+DOMINIO_LOGIN)?e.split('@')[0]:e}
async function fazerLogin(){
 const b=$('#lg-btn');b.disabled=true;b.textContent='Entrando...';
 try{const{data,error}=await sb.auth.signInWithPassword({email:emailDe($('#lg-email').value),password:$('#lg-senha').value});
  if(error||!data||!data.user){$('#lg-erro').textContent='Usuário ou senha incorretos.';b.disabled=false;b.textContent='Entrar';return}
  await entrar(data.user)}catch(e){$('#lg-erro').textContent='Sem conexão com a internet. Tente de novo.';b.disabled=false;b.textContent='Entrar'}
}
async function entrar(user){
 USER=user;telaAviso('Carregando seus dados...');
 let ms=null;try{const r=await sb.from('membros').select('loja_id,papel,lojas(nome)').eq('user_id',user.id);if(r.error)throw r.error;ms=r.data}catch(e){return telaAviso('Não consegui carregar seus dados. Verifique a internet.',`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`)}
 MASTER=false;try{const r=await sb.from('masters').select('user_id').eq('user_id',user.id);MASTER=!!(r.data&&r.data.length)}catch(e){}
 const todas=ms||[];LOJAS=todas.filter(x=>x.lojas);const bm=MASTER?`<button class="btn pri" onclick="masterPainel()">Painel master</button>`:'';
 if(!LOJAS.length)return telaAviso(todas.length?'O acesso a esta loja está suspenso. Fale com a GBR Assessoria.':'Seu usuário ainda não está ligado a nenhuma loja. Fale com a GBR Assessoria.',bm+`<button class="btn" onclick="sair()">Sair</button>`);
 let pref='';try{pref=localStorage.getItem('sk_loja')||''}catch(e){}
 const m=LOJAS.length===1?LOJAS[0]:LOJAS.find(x=>x.loja_id===pref);
 if(!m)return escolherLoja();
 await abrirLoja(m.loja_id);
}
function escolherLoja(){telaAviso('Qual loja você quer abrir?',LOJAS.map(m=>`<button class="btn" style="padding:12px" onclick="abrirLoja('${m.loja_id}')">${esc((m.lojas&&m.lojas.nome)||'Loja')}</button>`).join(''))}
async function abrirLoja(id){
 const m=LOJAS.find(x=>x.loja_id===id);if(!m)return;telaAviso('Carregando seus dados...');
 LOJA=id;LOJA_NOME=(m.lojas&&m.lojas.nome)||'';PAPEL=m.papel||'';try{localStorage.setItem('sk_loja',id)}catch(e){}
 let rows=null;try{const r=await sb.from('dados').select('loja_id,chave,valor').eq('loja_id',LOJA).not('chave','like','backup:%');if(r.error)throw r.error;rows=r.data||[]}catch(e){LOJA=null;return telaAviso('Não consegui carregar os dados da loja. Verifique a internet.',`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`)}
 _sync={};
 if(rows.length){const base=seed();S={versao:1,seq:2000,exemplo:false,config:{...base.config,logo:''},insumos:[],receitas:[],produtos:[],clientes:[],pedidos:[],orcamentos:[],lancamentos:[],compras:[],carrinhos:[],estoqueProntos:{},producoes:[]};
  for(const r of rows){aplicarChave(r.chave,r.valor);_sync[r.chave]=canon(r.valor)}cacheLocal()}
 else{S=vazio();Object.assign(S.config,{empresa:LOJA_NOME||'Minha confeitaria',marca:LOJA_NOME||'Minha confeitaria',marcaSub:'',instagram:'',pix:'',agradecimento:'Obrigada pela preferência!',avisoSite:'Faça seu pedido com antecedência. A data é confirmada pelo WhatsApp.'});cacheLocal();await enviar()}
 if(_canal){try{sb.removeChannel(_canal)}catch(e){}}
 _canal=sb.channel('dados-'+LOJA).on('postgres_changes',{event:'*',schema:'public',table:'dados',filter:'loja_id=eq.'+LOJA},p=>{if(chegouRemoto(p.new))aposRemoto()}).on('postgres_changes',{event:'*',schema:'public',table:'pedidos_site',filter:'loja_id=eq.'+LOJA},()=>carregarSite()).subscribe();
 SITE=[];_vit='';await carregarSlug();await carregarSite();publicarVitrine();
 if(lancarRecorrentes())save();
 mostrarApp(true);go(location.hash.slice(1)||'painel');backupDiario();
}
/* ============ painel master ============ */
const mAcento=t=>String(t||'').replace(/\bnao\b/g,'não').replace(/\bNao\b/g,'Não').replace(/\bJa\b/g,'Já').replace(/usuario/g,'usuário').replace(/Usuario/g,'Usuário').replace(/invalido/g,'inválido').replace(/invalidos/g,'inválidos').replace(/numeros/g,'números').replace(/traco/g,'traço').replace(/minimo/g,'mínimo').replace(/possivel/g,'possível').replace(/Voce/g,'Você').replace(/proprio/g,'próprio').replace(/Acao/g,'Ação').replace(/permissao/g,'permissão').replace(/ a loja/g,' à loja');
async function mCall(acao,body){try{const r=await sb.functions.invoke('master',{body:{acao,...(body||{})}});if(r.error){let m='';try{const j=await r.error.context.json();m=j&&j.erro}catch(e){}toast(mAcento(m)||'Não foi possível concluir. Verifique a internet.','bad');return null}if(r.data&&r.data.erro){toast(mAcento(r.data.erro),'bad');return null}return r.data}catch(e){toast('Não foi possível concluir. Verifique a internet.','bad');return null}}
const mLogin=e=>String(e||'').endsWith('@'+DOMINIO_LOGIN)?e.split('@')[0]:e;
const mQuando=d=>{if(!d)return'nunca entrou';const x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
async function masterPainel(){if(!MASTER)return;openModal('Painel master','<div class="empty">Carregando...</div>',`<button class="btn" onclick="closeModal()">Fechar</button>`,true);const d=await mCall('listar');if(!d)return;MD=d;masterDesenha()}
function masterDesenha(){const d=MD;if(!d)return;const U=Object.fromEntries(d.usuarios.map(u=>[u.id,u]));const base=location.href.split('#')[0].replace(/index\.html$/,'');
 const linhaU=(u,m,l)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)"><div style="min-width:150px"><b>${esc(mLogin(u.email))}</b>${u.id===d.eu?' <span class="small muted">(você)</span>':''}<br><span class="small muted">${m?(m.papel==='admin'?'administrador':'dona da loja')+' · ':''}último acesso: ${mQuando(u.ultimo_acesso)}</span>${u.bloqueado?'<br><span class="pill" style="background:var(--bad-soft,#fbe9e9);color:var(--bad,#a8323a)">Bloqueado</span>':''}</div>
  <div class="actions"><button class="btn sm" onclick="masterSenha('${u.id}')">Senha</button> ${u.id===d.eu?'':`<button class="btn sm" onclick="masterBloqU('${u.id}',${!u.bloqueado})">${u.bloqueado?'Desbloquear':'Bloquear'}</button>`} ${l?`<button class="btn sm ghost danger" onclick="masterTirar('${u.id}','${l.id}')">Remover</button>`:''}</div></div>`;
 const lojas=d.lojas.map(l=>{const ms=d.membros.filter(m=>m.loja_id===l.id);const sl=(d.slugs.find(x=>x.loja_id===l.id)||{}).slug||'';
  return`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h3 style="margin:0">${esc(l.nome)} ${l.bloqueada?'<span class="pill" style="background:var(--bad-soft,#fbe9e9);color:var(--bad,#a8323a)">Loja bloqueada</span>':''}</h3>${sl?`<div class="small muted" style="word-break:break-all">Pedidos: ${esc(base)}pedir/?loja=${esc(sl)}</div>`:''}</div>
   <div class="actions"><button class="btn sm" onclick="masterNovoU('${l.id}')">+ Usuário</button><button class="btn sm" onclick="masterRenomear('${l.id}')">Renomear</button><button class="btn sm" onclick="masterBloqL('${l.id}',${!l.bloqueada})">${l.bloqueada?'Desbloquear loja':'Bloquear loja'}</button></div></div>
   <div style="margin-top:10px">${ms.length?ms.map(m=>U[m.user_id]?linhaU(U[m.user_id],m,l):'').join(''):'<div class="small muted">Nenhum usuário ligado a esta loja.</div>'}</div></div>`}).join('');
 const soltos=d.usuarios.filter(u=>!d.membros.some(m=>m.user_id===u.id));
 $('.modal-b').innerHTML=`<p class="small muted" style="margin:0 0 12px">Só você vê este painel. As senhas não podem ser exibidas, mas você pode definir uma nova a qualquer momento.</p><div class="actions" style="margin-bottom:14px"><button class="btn pri" onclick="masterNovaLoja()">+ Nova loja</button></div>${lojas}${soltos.length?`<div class="card"><h3 style="margin:0 0 6px">Usuários sem loja</h3>${soltos.map(u=>linhaU(u,null,null)).join('')}</div>`:''}`}
function mForm(titulo,corpo,rotulo,acao){openModal(titulo,corpo,`<button class="btn" onclick="masterPainel()">Voltar</button><button class="btn pri" id="m-ok">${rotulo}</button>`);$('#m-ok').onclick=async()=>{const b=$('#m-ok');b.disabled=true;const ok=await acao();if(ok){toast(ok===true?'Feito':ok);masterPainel()}else b.disabled=false}}
function masterNovaLoja(){mForm('Nova loja',`<label class="f">Nome da loja<input type="text" id="m-nome" maxlength="80" oninput="$('#m-slug').value=slugify(this.value)"></label><label class="f">Link de pedidos <small>(só letras, números e traço)</small><input type="text" id="m-slug" maxlength="40"></label><p class="small muted">A loja começa vazia e você já entra nela como administrador. Depois crie o usuário da dona.</p>`,'Criar loja',async()=>{const r=await mCall('criar_loja',{nome:$('#m-nome').value,slug:$('#m-slug').value});if(r&&USER)await entrarSilencioso();return r?'Loja criada':null})}
function masterNovoU(lid){const l=MD.lojas.find(x=>x.id===lid);mForm('Novo usuário em '+l.nome,`<label class="f">Login <small>(sem espaço; a pessoa entra com esse nome)</small><input type="text" id="m-login" maxlength="40" autocapitalize="off" autocomplete="off"></label><label class="f">Senha <small>(mínimo de 6 caracteres)</small><input type="text" id="m-senha" maxlength="60" autocomplete="off"></label><label class="f">Tipo<select id="m-papel"><option value="dona">Dona da loja</option><option value="admin">Administrador</option></select></label><p class="small muted">Anote a senha agora: depois de criada, ela não pode ser exibida, só trocada.</p>`,'Criar usuário',async()=>{const r=await mCall('criar_usuario',{loja_id:lid,login:$('#m-login').value,senha:$('#m-senha').value,papel:$('#m-papel').value});return r?'Usuário criado':null})}
function masterSenha(uid){const u=MD.usuarios.find(x=>x.id===uid);mForm('Nova senha de '+mLogin(u.email),`<label class="f">Nova senha <small>(mínimo de 6 caracteres)</small><input type="text" id="m-senha" maxlength="60" autocomplete="off"></label><p class="small muted">A senha antiga deixa de valer. Avise a pessoa da nova senha.</p>`,'Salvar senha',async()=>{const r=await mCall('senha',{user_id:uid,senha:$('#m-senha').value});return r?'Senha alterada':null})}
function masterRenomear(lid){const l=MD.lojas.find(x=>x.id===lid);mForm('Renomear loja',`<label class="f">Nome da loja<input type="text" id="m-nome" maxlength="80" value="${esc(l.nome)}"></label><p class="small muted">Muda o nome na lista de lojas. A marca que aparece para as clientes é a das Configurações da loja, e o link de pedidos continua o mesmo.</p>`,'Salvar',async()=>{const r=await mCall('renomear_loja',{loja_id:lid,nome:$('#m-nome').value});return r?'Nome alterado':null})}
async function masterBloqU(uid,on){const u=MD.usuarios.find(x=>x.id===uid);askConfirm(on?`Bloquear o usuário ${mLogin(u.email)}? Ele não vai mais conseguir entrar.`:`Desbloquear o usuário ${mLogin(u.email)}?`,'Confirmar',async()=>{const r=await mCall('bloquear_usuario',{user_id:uid,on});if(r)toast(on?'Usuário bloqueado':'Usuário desbloqueado');masterPainel()},'Voltar',masterPainel)}
async function masterBloqL(lid,on){const l=MD.lojas.find(x=>x.id===lid);askConfirm(on?`Bloquear a loja ${l.nome}? Ninguém dela vai conseguir abrir o sistema até você desbloquear. Os dados ficam guardados.`:`Desbloquear a loja ${l.nome}?`,'Confirmar',async()=>{const r=await mCall('bloquear_loja',{loja_id:lid,on});if(r)toast(on?'Loja bloqueada':'Loja desbloqueada');masterPainel()},'Voltar',masterPainel)}
async function masterTirar(uid,lid){const u=MD.usuarios.find(x=>x.id===uid),l=MD.lojas.find(x=>x.id===lid);askConfirm(`Tirar o acesso de ${mLogin(u.email)} à loja ${l.nome}? O usuário continua existindo, só deixa de ver esta loja.`,'Remover acesso',async()=>{const r=await mCall('desvincular',{user_id:uid,loja_id:lid});if(r)toast('Acesso removido');masterPainel()},'Voltar',masterPainel)}
async function entrarSilencioso(){try{const r=await sb.from('membros').select('loja_id,papel,lojas(nome)').eq('user_id',USER.id);if(!r.error)LOJAS=(r.data||[]).filter(x=>x.lojas)}catch(e){}}
async function sair(){try{await sb.auth.signOut()}catch(e){}location.reload()}
function trocarSenha(){openModal('Trocar senha',`<label class="f">Nova senha <small>(mínimo de 6 caracteres)</small><input type="password" id="ns-1" autocomplete="new-password"></label><label class="f">Repita a nova senha<input type="password" id="ns-2" autocomplete="new-password"></label>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="salvarSenha()">Salvar senha</button>`)}
async function salvarSenha(){const a=$('#ns-1').value,b=$('#ns-2').value;if(a.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.','bad');if(a!==b)return toast('As duas senhas não são iguais.','bad');
 try{const{error}=await sb.auth.updateUser({password:a});if(error)throw error;closeModal();toast('Senha alterada')}catch(e){toast('Não foi possível trocar a senha agora.','bad')}}
function contaCard(){if(!NUVEM||!USER)return'';return`<div class="card" style="margin-bottom:16px"><h3>Sua conta</h3><div class="detail-grid"><div><span>Loja</span><b>${esc(LOJA_NOME)}</b></div><div><span>Usuário</span>${esc(nomeUsuario())} <span class="small muted">(${ADMIN()?'administrador':'dona da loja'})</span></div><div><span>Situação</span>${syncHtml()}</div></div>
 <div class="actions" style="margin-top:12px">${MASTER?`<button class="btn pri" onclick="masterPainel()">Painel master</button>`:''}<button class="btn" onclick="trocarSenha()">Trocar senha</button>${LOJAS.length>1?`<button class="btn" onclick="escolherLoja()">Trocar de loja</button>`:''}<button class="btn" onclick="sair()">Sair</button></div></div>`}
async function iniciar(){
 if(!NUVEM){load();if(lancarRecorrentes())save();go(location.hash.slice(1)||'painel');return}
 if(!window.supabase||!window.supabase.createClient)return telaAviso('Não consegui carregar o sistema. Verifique a internet.',`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`);
 sb=window.supabase.createClient(SB_URL,SB_KEY);
 try{const{data}=await sb.auth.getSession();if(data&&data.session)return entrar(data.session.user)}catch(e){}
 telaLogin();
}
window.addEventListener('beforeunload',e=>{if(NUVEM&&_syncSt!=='ok'){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',()=>{if(_syncSt==='erro')enviar()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')recarregar()});
iniciar();
</script>
