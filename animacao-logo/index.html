function camScale(t){const base=.965+.035*esine(prog(t,3.2,T.final));const q=t-T.climax;return base+(q>0?.012*(1-Math.exp(-30*q))*Math.exp(-5*q):0)}

const u2s=(t,x,y)=>{const m=camM(t);return[m[0]*x+m[4],m[3]*y+m[5]]};
let METAL;

  g.addColorStop(0,'#caa665');g.addColorStop(.3,'#ecd49b');g.addColorStop(.46,'#c19a58');g.addColorStop(.62,'#95703b');g.addColorStop(.85,'#b48c4f');g.addColorStop(1,'#d7b779');return METAL=g}

function sweep(c,t,t0,t1,alpha,hw,clipPath){if(t<=t0||t>=t1)return;const q=eio(prog(t,t0,t1));c.save();c.setTransform(...camM(t));c.clip(clipPath,'evenodd');const bx=lerp(-140,1060,q);

function render(t){

  air(T.lines,.9,600,3500,.035,-.7,.7);

  // final: cadência e resolução
  piano(8.0,36,.3,1);piano(8.0,46,.26,1);piano(8.0,58,.24,1);piano(8.0,62,.24,1);

let AUDIO=null,playing=false,actx=null,srcNode=null,startAt=0,offset=0;
const $=id=>document.getElementById(id),status=m=>$('status').innerHTML=m;
const fmt=t=>t.toFixed(2).replace('.',',')+' s';
function setT(t){$('scrub').value=t;$('tlabel').textContent=fmt(t)}
function stop(){playing=false;try{srcNode&&srcNode.stop()}catch(e){}$('play').textContent='Reproduzir'}
async function play(){if(playing){stop();return}
  actx=actx||new AudioContext({sampleRate:SR});await actx.resume();offset=+$('scrub').value;if(offset>=DUR-.05)offset=0;
  srcNode=actx.createBufferSource();srcNode.buffer=AUDIO;srcNode.connect(actx.destination);startAt=actx.currentTime+.05;srcNode.start(startAt,offset);playing=true;$('play').textContent='Pausar';
  const loop=()=>{if(!playing)return;const t=offset+actx.currentTime-startAt;if(t>=DUR){render(DUR);setT(DUR);stop();return}render(Math.max(0,t));setT(Math.max(0,t));requestAnimationFrame(loop)};loop()}
async function loadMuxer(){try{return await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm')}catch(e){return await import('./mp4-muxer.mjs')}}
async function pickVideo(){const base={width:W,height:H,bitrate:22_000_000,framerate:FPS};
  for(const codec of['avc1.640033','avc1.64002A','avc1.4D0033','avc1.42003E']){try{const s=await VideoEncoder.isConfigSupported({...base,codec,avc:{format:'avc'}});if(s.supported)return{cfg:{...base,codec,avc:{format:'avc'},latencyMode:'quality'},mux:'avc'}}catch(e){}}
  const s=await VideoEncoder.isConfigSupported({...base,codec:'vp09.00.41.08'});if(s.supported)return{cfg:{...base,codec:'vp09.00.41.08',latencyMode:'quality'},mux:'vp9'};throw new Error('Este navegador não codifica vídeo com WebCodecs.')}
async function pickAudio(){const base={sampleRate:SR,numberOfChannels:2,bitrate:192000};
  try{const s=await AudioEncoder.isConfigSupported({...base,codec:'mp4a.40.2'});if(s.supported)return{cfg:{...base,codec:'mp4a.40.2'},mux:'aac'}}catch(e){}
  const s=await AudioEncoder.isConfigSupported({...base,codec:'opus'});if(s.supported)return{cfg:{...base,codec:'opus'},mux:'opus'};throw new Error('Sem codificador de áudio.')}
async function exportVideo(){
  if(!('VideoEncoder' in window)){status('Este navegador não tem WebCodecs. Use o Chrome ou o Edge atualizados.');return}
  stop();$('exp').disabled=$('play').disabled=true;
  try{
    const{Muxer,ArrayBufferTarget}=await loadMuxer();const v=await pickVideo(),a=await pickAudio();
    const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:v.mux,width:W,height:H,frameRate:FPS},audio:{codec:a.mux,numberOfChannels:2,sampleRate:SR},fastStart:'in-memory',firstTimestampBehavior:'offset'});
    let err=null;const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});ve.configure(v.cfg);
    const NF=DUR*FPS;
    for(let i=0;i<NF;i++){if(err)throw err;render(i/FPS);setT(i/FPS);const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(f,{keyFrame:i%FPS===0});f.close();
      while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,2));if(i%10===0){status(`Exportando quadros: ${i+1}/${NF}`);await new Promise(r=>setTimeout(r,0))}}
    await ve.flush();
    const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>err=e});ae.configure(a.cfg);
    const L=AUDIO.getChannelData(0),Rr=AUDIO.getChannelData(1),CH=1024;
    for(let s=0;s<L.length;s+=CH){const n=Math.min(CH,L.length-s),buf=new Float32Array(n*2);buf.set(L.subarray(s,s+n),0);buf.set(Rr.subarray(s,s+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(s*1e6/SR),data:buf});ae.encode(ad);ad.close()}
    await ae.flush();if(err)throw err;muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'}),url=URL.createObjectURL(blob);
    const note=(v.mux!=='avc'||a.mux!=='aac')?` (este navegador não tem H.264/AAC; usei ${v.mux.toUpperCase()}/${a.mux.toUpperCase()})`:' (H.264 + AAC)';
    status(`Pronto${note}: <a href="${url}" download="sweet-ka-logo.mp4">baixar sweet-ka-logo.mp4</a> · ${(blob.size/1e6).toFixed(1)} MB`);
    const aEl=document.createElement('a');aEl.href=url;aEl.download='sweet-ka-logo.mp4';document.body.appendChild(aEl);aEl.click();aEl.remove();
    if(SERVER)await fetch('/save?name=sweet-ka-webcodecs.mp4',{method:'POST',body:blob});
    return{size:blob.size,video:v.cfg.codec,audio:a.cfg.codec};
  }catch(e){status('Falha na exportação: '+e.message);throw e}
  finally{$('exp').disabled=$('play').disabled=false}}

// ---------- modo servidor (painel oculto): quadros e WAV por POST ----------
const SERVER=new URLSearchParams(location.search).has('servidor');
function wav(buf){const n=buf.length,ab=new ArrayBuffer(44+n*8),v=new DataView(ab);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*8,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,3,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*8,true);v.setUint16(32,8,true);v.setUint16(34,32,true);w(36,'data');v.setUint32(40,n*8,true);
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let o=44;for(let i=0;i<n;i++){v.setFloat32(o,L[i],true);v.setFloat32(o+4,R[i],true);o+=8}return ab}
window.render=render;
window.saveFrame=async(t,name)=>{render(t);const b=await new Promise(r=>cv.toBlob(r,'image/png'));await fetch('/save?name='+encodeURIComponent(name),{method:'POST',body:b})};
window.exportViaServer=async()=>{await fetch('/audio',{method:'POST',body:wav(AUDIO)});await fetch('/start',{method:'POST'});
  for(let i=0;i<DUR*FPS;i++){render(i/FPS);const d=ctx.getImageData(0,0,W,H).data;await fetch('/frame',{method:'POST',body:d})}
  return await(await fetch('/end',{method:'POST'})).text()};

$('play').onclick=play;$('exp').onclick=()=>exportVideo().catch(()=>{});
